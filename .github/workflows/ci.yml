name: C++ CI/CD Demo

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release -j

      - name: 运行测试（显示详细输出）
        run: cd build && ctest -V

      - name: 运行程序
        run: ./build/app

  deploy-staging:
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: 模拟部署到 staging
        run: |
          echo "正在部署到 staging..."
          echo "部署完成：https://staging.example.com"